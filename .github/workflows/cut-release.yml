# Cuts a release from the Actions tab: bumps the version, writes the changelog, tags, creates the
# release with its notes, then runs the release build (a tag pushed with this token does not trigger it).
name: cut-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or an exact X.Y.Z"
        required: true
        default: patch
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - id: cut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          nix develop --command scripts/release-tag.sh "${{ inputs.version }}"
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
  build:
    needs: cut
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.cut.outputs.tag }}
