# git-cliff configuration: Keep a Changelog structure from Conventional Commit messages
# (feat:/fix:/perf:/docs:/chore:...); anything else lands under Other.
[changelog]
header = """
# Changelog

All notable changes to alexsay. The format follows
[Keep a Changelog](https://keepachangelog.com), versions follow
[SemVer](https://semver.org).
"""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ({{ commit.id | truncate(length=8, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^chore\\\\(release\\\\)", skip = true },
  { message = "^Release ", skip = true },
  { message = "^chore|^ci|^build|^test", group = "<!-- 5 -->Internal" },
  { message = ".*", group = "<!-- 6 -->Changes" },
]
