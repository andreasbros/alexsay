[workspace]
resolver = "3"
members = ["core", "daemon"]

[workspace.package]
edition = "2024"
version = "0.1.6"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
thiserror = "2"
base64 = "0.23"
sha2 = "0.11"
semver = "1"
ed25519-dalek = "3"
tract-onnx = "0.22.4"
rustpotter = "3"
hound = "3.5"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Dependencies optimised in dev and test builds too: the wake word engines (tract above all) run ten
# times slower unoptimised, and the tests run them over real recordings
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# rustpotter's candle-core, patched so it builds with the `half` that tract needs (see vendor/candle-core/PATCHED.md)
[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
