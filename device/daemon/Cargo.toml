[package]
name = "alexsay-daemon"
description = "The alexsay speaker daemon for the Raspberry Pi"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alexsay"
path = "src/main.rs"

[dependencies]
alexsay-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "http2"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }

[lints]
workspace = true
