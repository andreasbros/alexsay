# The "Alexsay" classifier for LiveKit's wake word toolkit (livekit-wakeword, see scripts/wake-train.sh).
# `just wake-train` runs it; `just wake-train small` runs a quick end-to-end check with ./alexsay-small.yaml.
model_name: alexsay

# Said like Aleksei (a-LEK-say): espeak-ng renders both spellings as ɐlˈɛkseɪ
target_phrases: ["alexsay", "aleksay"]

n_samples: 20000
n_samples_val: 4000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

# What it must not wake on. "Alexa, say" is the hardest: ɐlˈɛksə sˈeɪ against ɐlˈɛkseɪ.
# Not "Alexei": it is the same sound.
custom_negative_phrases:
  - "alexa"
  - "alexa say"
  - "alexa stop"
  - "alexa play"
  - "hey alexa"
  - "alex"
  - "alex says"
  - "alex said"
  - "hey alex"
  - "alexis"
  - "alexander"
  - "lexi"
  - "a lexicon"
  - "excellent"
  - "excellent day"
  - "electric"
  - "let's say"
  - "hello there"
  - "what time is it"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 2
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  # The head LiveKit measured at 0.08 false wakes an hour against openWakeWord's 8.5
  model_type: conv_attention
  model_size: small

steps: 50000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.2

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
