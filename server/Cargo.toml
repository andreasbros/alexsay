[package]
name = "alexsay-server"
description = "The alexsay server for your own machine: the Cloudflare Worker, its app and workerd in one binary"
version = "0.1.8"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "alexsay-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.4"
rpassword = "7"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
